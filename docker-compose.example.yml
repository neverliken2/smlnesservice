# =============================================================
# docker-compose.example.yml — ตัวอย่างสำหรับลูกค้า 1 ราย
#
# วิธีใช้:
#   1. copy เป็น docker-compose.yml
#   2. แก้ env (DB_HOST, JWT_SECRET, ฯลฯ) ให้ตรง environment ลูกค้า
#   3. docker compose up -d --build
#
# หมายเหตุ:
#   - service นี้ไม่ host PG เอง — connect ออกไปที่ PG ของลูกค้า
#   - 1 instance ต่อ 1 ลูกค้า (Model A) — ไม่ใช่ multi-tenant ใน container เดียว
# =============================================================

services:
  smlnesservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smlnesservice
    restart: unless-stopped
    ports:
      # บน server ลูกค้าแนะนำ map ผ่าน reverse proxy (nginx) → 443
      - "8003:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      # ---- PostgreSQL ----
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME_PREFIX: ${DB_NAME_PREFIX:-smlerpmain}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}

      # ---- Auth ----
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      PRE_SELECT_EXPIRES_IN: ${PRE_SELECT_EXPIRES_IN:-2m}
      API_KEY_SALT_ROUNDS: ${API_KEY_SALT_ROUNDS:-12}
    # อ่าน env file นอก git
    env_file:
      - .env
    # โหลดเฉพาะที่จำเป็น — log ออก stdout
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

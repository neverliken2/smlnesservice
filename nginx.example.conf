# =============================================================
# nginx.example.conf — reverse proxy + TLS หน้า smlnesservice
#
# วิธีใช้:
#   1. แทน <domain> ด้วยโดเมนจริงของลูกค้า (เช่น api.customer.com)
#   2. วาง cert ไว้ที่ /etc/nginx/certs/  (หรือใช้ Let's Encrypt + certbot)
#   3. ถ้ารัน nginx ในเครื่อง host (ไม่ใช่ container) → proxy_pass = 127.0.0.1:8003
#      ถ้ารัน nginx ใน docker compose เดียวกัน → proxy_pass = http://smlnesservice:3000
#
# Production tips:
#   - smlnesservice ควร bind 127.0.0.1:8003 (ไม่ expose port ออก internet ตรง ๆ)
#   - ขนาด body ของ POST /credit-notes (transaction) อาจมีหลาย line item
#     → ตั้ง client_max_body_size 1m ก็เกินพอ
# =============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name <domain>;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name <domain>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ใช้ TLS 1.2+ เท่านั้น
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS (อย่าใส่ถ้ายังไม่พร้อม commit subdomain ทั้งหมดเป็น HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # ---- proxy → smlnesservice ----
    location / {
        # เลือก 1:
        proxy_pass http://127.0.0.1:8003;          # nginx รันบน host
        # proxy_pass http://smlnesservice:3000;    # nginx รันใน docker compose เดียวกัน

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # NestJS endpoint timeouts (default 60s แต่ DB query บางตัว 30s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- log ----
    access_log /var/log/nginx/smlnesservice.access.log;
    error_log  /var/log/nginx/smlnesservice.error.log warn;
}
